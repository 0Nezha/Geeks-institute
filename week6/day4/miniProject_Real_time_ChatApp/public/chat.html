<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chat Room</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="chat-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2 id="roomName">Room</h2>
        <button id="leaveBtn" class="btn small">Leave</button>
      </div>
      <div class="users-box">
        <h3>Users</h3>
        <ul id="usersList"></ul>
      </div>
    </aside>

    <main class="chat-main">
      <div id="messages" class="messages"></div>

      <div class="chat-form">
        <input id="msgInput" type="text" placeholder="Type a message and press Enter" maxlength="1000" />
        <button id="sendBtn" class="btn">Send</button>
      </div>
    </main>
  </div>

  <audio id="notifSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
